name: Build APK

on:
push:
branches:
- "**"
tags:
- "v*"

pull_request:

workflow_dispatch:

permissions:
contents: write

jobs:

============================================================

DEBUG BUILD

Runs on every push and pull request

============================================================

build-debug:
name: Build Debug APK
runs-on: ubuntu-latest

steps:

  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Assemble debug APK
    run: |
      gradle assembleDebug --no-daemon

  - name: Upload debug APK
    uses: actions/upload-artifact@v4
    with:
      name: repomaster-debug-apk
      path: app/build/outputs/apk/debug/*.apk
      retention-days: 7

============================================================

RELEASE BUILD

Runs only when:

1. A version tag such as v1.0.0 is pushed

2. Workflow is manually triggered

The GitHub Release is created only for a v* tag.

============================================================

build-release:
name: Build Signed Release APK
runs-on: ubuntu-latest

if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

steps:

  - name: Checkout repository
    uses: actions/checkout@v4


  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"


  - name: Set up Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"


  # ========================================================
  # CONFIGURE RELEASE KEYSTORE
  # ========================================================
  - name: Configure release keystore
    id: keystore
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    run: |
      if [ -z "$KEYSTORE_B64" ]; then
        echo "::error::Missing KEYSTORE_B64 secret"
        exit 1
      fi

      if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
        echo "::error::Missing signing passwords"
        exit 1
      fi

      if [ "$STORE_PASSWORD" != "$KEY_PASSWORD" ]; then
        echo "::error::STORE_PASSWORD and KEY_PASSWORD must be identical for PKCS12 keystores"
        exit 1
      fi

      KEYSTORE_PATH="$RUNNER_TEMP/repomaster-release.keystore"

      echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"

      if [ ! -s "$KEYSTORE_PATH" ]; then
        echo "::error::Keystore file was not created"
        exit 1
      fi

      KEY_ALIAS="upload"

      echo "::add-mask::$STORE_PASSWORD"

      echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
      echo "keystore_password=$STORE_PASSWORD" >> "$GITHUB_OUTPUT"
      echo "key_password=$KEY_PASSWORD" >> "$GITHUB_OUTPUT"
      echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"


  # ========================================================
  # BUILD SIGNED RELEASE APK
  # ========================================================
  - name: Build release APK
    run: |
      gradle assembleRelease \
        -PREPOMASTER_RELEASE_STORE_FILE="${{ steps.keystore.outputs.keystore_path }}" \
        -PREPOMASTER_RELEASE_STORE_PASSWORD="${{ steps.keystore.outputs.keystore_password }}" \
        -PREPOMASTER_RELEASE_KEY_ALIAS="${{ steps.keystore.outputs.key_alias }}" \
        -PREPOMASTER_RELEASE_KEY_PASSWORD="${{ steps.keystore.outputs.key_password }}" \
        --no-daemon


  # ========================================================
  # LOCATE RELEASE APK
  # ========================================================
  - name: Locate release APK
    id: apk
    run: |
      APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)

      if [ -z "$APK_PATH" ]; then
        echo "::error::Release APK not found"
        exit 1
      fi

      echo "APK found: $APK_PATH"

      echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"


  # ========================================================
  # UPLOAD RELEASE APK AS ACTIONS ARTIFACT
  # ========================================================
  - name: Upload release APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: repomaster-release-apk
      path: ${{ steps.apk.outputs.path }}
      retention-days: 30


  # ========================================================
  # CREATE GITHUB RELEASE
  #
  # Only runs when triggered by a v* version tag.
  #
  # Example:
  # v1.0.0
  # v1.1.0
  # v2.0.0
  # ========================================================
  - name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: softprops/action-gh-release@v2
    with:
      files: ${{ steps.apk.outputs.path }}
      generate_release_notes: true